<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none">
  <!-- Building logo - stylized with door cutout -->
  <g transform="translate(60, 20)">
    <!-- Top-left triangular peak -->
    <polygon points="0,60 55,0 55,60" fill="#ffffff"/>
    <!-- Top-right larger triangular peak -->
    <polygon points="60,60 115,0 180,60 180,0" fill="#ffffff" opacity="0"/>
    <polygon points="60,60 115,0 180,60" fill="#ffffff"/>
    <!-- Main building body - two panels forming a door shape -->
    <!-- Left panel (smaller, door-like) -->
    <polygon points="0,65 55,65 55,240 0,240" fill="#ffffff"/>
    <!-- Right panel (larger, angled bottom-right) -->
    <polygon points="60,65 180,65 180,240 60,260" fill="#ffffff"/>
    <!-- Inner door cutout (dark) -->
    <polygon points="18,90 40,75 40,225 18,225" fill="#0f1b33"/>
    <!-- Vertical divider between panels -->
    <rect x="55" y="65" width="5" height="175" fill="#0f1b33"/>
  </g>
  <!-- Text: צמד ברזל -->
  <text x="150" y="310" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff">צמד ברזל</text>
  <!-- Subtitle: יזמות ונדלן -->
  <text x="150" y="350" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="26" font-weight="400" fill="#ffffff">יזמות ונדל"ן</text>
</svg>
