<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none">
  <!-- Iron Pair ("צמד ברזל") building logo -->
  <g>
    <!-- Right (larger) building: angled trapezoid top, tall rectangular body, angled bottom-right base -->
    <path d="M 130 80 L 190 20 L 250 80 L 250 260 L 130 280 Z" fill="#ffffff"/>

    <!-- Left (smaller) building: triangular pointed roof, rectangular body -->
    <path d="M 70 120 L 120 80 L 120 260 L 70 260 Z" fill="#ffffff"/>

    <!-- Gap/shadow between the two buildings to give the "pair" effect -->
    <path d="M 120 80 L 120 260 L 130 262 L 130 80 Z" fill="#0f1b33"/>
  </g>

  <!-- Text: צמד ברזל -->
  <text x="150" y="325" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">צמד ברזל</text>
  <!-- Subtitle: יזמות ונדל״ן -->
  <text x="150" y="360" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="400" fill="#ffffff">יזמות ונדל״ן</text>
</svg>
