<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="#ffffff">
  <!-- Building icon - two geometric shapes -->
  <g transform="translate(75, 10)">
    <!-- Left building piece -->
    <polygon points="0,100 0,280 60,280 60,60 30,30" fill="#ffffff"/>
    <!-- Right building piece -->
    <polygon points="70,0 70,280 140,280 140,40" fill="#ffffff"/>
    <!-- Triangle detail -->
    <polygon points="30,30 60,60 60,30" fill="none"/>
  </g>
  <!-- Text: צמד ברזל -->
  <text x="150" y="325" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="48" font-weight="900" fill="#ffffff">צמד ברזל</text>
  <!-- Subtitle: יזמות ונדלן -->
  <text x="150" y="365" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">יזמות ונדלן</text>
</svg>
